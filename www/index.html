<html lang="tr">
<head>
  <!-- ═══ BU BLOK ENTEGRASYONDA AYNEN KORUNUR (başlangıç) ═══ -->

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="description" content="Her gün beş İngilizce kalıp. Oku, deftere yaz, çeteleye çak. Hesap yok, internet gerekmez.">
  <meta name="theme-color" content="#0433DD">
  <meta name="color-scheme" content="dark">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- iOS ana ekran -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="chunkla">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Bağlantı önizlemesi (LinkedIn, WhatsApp, X). og:image ve og:url TAM adres olmalı. -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="tr_TR">
  <meta property="og:site_name" content="chunkla">
  <meta property="og:title" content="chunkla — günde beş İngilizce kalıp">
  <meta property="og:description" content="Oku, deftere yaz, çeteleye çak. Hesap yok, reklam yok, internet gerekmez.">
  <meta property="og:url" content="https://suedakurnaz.github.io/chunkla/">
  <meta property="og:image" content="https://suedakurnaz.github.io/chunkla/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <!-- ═══ BU BLOK ENTEGRASYONDA AYNEN KORUNUR (bitiş) ═══ -->

  <style>
    body { margin: 0; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
           font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 36rem; margin: 0 auto; padding: 16px 0 48px; }
    .item { padding: 12px 0; border-bottom: 1px solid #ccc; }
    .item button { min-height: 44px; min-width: 44px; }
    .en { font-weight: 600; }
    .tr { opacity: .7; }
    :focus-visible { outline: 3px solid; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <p id="status">Yükleniyor…</p>
    <div id="list"></div>
    <p><button id="done" type="button">Deftere yazdım</button></p>
    <p><button id="install" type="button" hidden>Uygulama olarak yükle</button></p>
    <p id="pwa"></p>
    <p id="error" role="alert"></p>
  </main>

  <script src="chunks.js"></script>
  <script src="js/core.js"></script>
  <script src="js/pwa.js"></script>
  <script>
    (function () {
      var C = window.Chunkla;
      var statusEl = document.getElementById('status');
      var installEl = document.getElementById('install');
      var pwaEl = document.getElementById('pwa');
      function renderPwa() {
        var P = window.ChunklaPWA;
        installEl.hidden = !P.canPrompt();
        pwaEl.textContent = 'platform: ' + P.platform() + ' · ana ekrandan: ' + (P.isStandalone() ? 'evet' : 'hayır') +
          ' · service worker: ' + ('serviceWorker' in navigator && navigator.serviceWorker.controller ? 'aktif' : 'yok');
      }
      installEl.onclick = function () { window.ChunklaPWA.promptInstall().then(renderPwa); };
      window.ChunklaPWA.onChange(renderPwa);
      renderPwa();
      var listEl = document.getElementById('list');
      var doneEl = document.getElementById('done');
      var day = 1;

      function render() {
        statusEl.textContent = day + '. gün · seri ' + C.streak() + ' · işaretli ' + C.totalMarked() +
          ' · ' + (C.isDayDone(day) ? 'tamam' : 'devam') + '';
        listEl.innerHTML = '';
        C.chunksForDay(day).forEach(function (row) {
          var div = document.createElement('div');
          div.className = 'item';
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = row.marked ? '✓' : '○';
          btn.setAttribute('aria-pressed', String(row.marked));
          btn.setAttribute('aria-label', row.item.chunk + ' işaretle');
          btn.onclick = function () { C.toggleMark(day, row.slot); render(); };
          var en = document.createElement('div'); en.className = 'en'; en.textContent = row.item.chunk;
          var tr = document.createElement('div'); tr.className = 'tr'; tr.textContent = row.item.tr;
          div.appendChild(btn); div.appendChild(en); div.appendChild(tr);
          listEl.appendChild(div);
        });
      }

      doneEl.onclick = function () { C.markDayDone(day).then(render); };

      C.init().then(function (r) {
        day = r.today;
        render();
      }).catch(function (e) {
        document.getElementById('error').textContent = 'Hata: ' + e.message;
      });
    })();
  </script>
</body>
</html>
